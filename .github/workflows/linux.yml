name: linux

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test-all in the Fenix image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the Fenix image
        run: docker build -t fenix:dev .
      - name: Lint and test-all inside the image
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" fenix:dev sh /src/docker/test-in-container.sh
