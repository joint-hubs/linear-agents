name: linux

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test-all in the Fenix image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the Fenix image
        run: docker build -t fenix:dev .
      - name: Lint and test-all inside the image
        run: docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" fenix:dev sh /src/docker/test-in-container.sh
      - name: Child isolation lane (FOC-802)
        run: docker run --rm --user root -v "$GITHUB_WORKSPACE:/src:ro" fenix:dev sh /src/docker/test-isolation.sh
      - name: Thin uid layer on top of the image (FOC-777)
        run: |
          docker build -f docker/Dockerfile.uid --build-arg BASE=fenix:dev --build-arg FENIX_UID=1234 --build-arg FENIX_GID=1234 -t fenix:uid1234 .
          docker run --rm --entrypoint sh fenix:uid1234 -c 'id; test "$(id -u)" = 1234 && test "$(id -g)" = 1234 && test "$(id -u fenix-child)" = 2234 && test "$(stat -c %u /opt/fenix)" = 1234'
      - name: Child isolation lane on the thin layer (FOC-777)
        run: docker run --rm --user root -v "$GITHUB_WORKSPACE:/src:ro" fenix:uid1234 sh /src/docker/test-isolation.sh
