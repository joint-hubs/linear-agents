name: publish-image

# FOC-775: the Fenix image on GHCR. Publishes ghcr.io/joint-hubs/fenix with
# the repository's own GITHUB_TOKEN (packages: write) — no personal token.
#
#   push of a tag v*        → :<version> (v1.0.0 → 1.0.0), :sha-<short>, and
#                             :latest when the tag is a plain release
#                             (no -rc / -beta suffix)
#   workflow_dispatch       → :sha-<short> plus :<branch> (":main" from main) —
#                             the smoke run that proves publishing works
#
# The image is built for uid/gid 1000 (the Dockerfile's FENIX_UID/FENIX_GID
# defaults); a host with another uid builds its thin layer on top at
# `fenix up` / `fenix update` time (FOC-777). One build, loaded locally; the
# smoke step fails on any tool that is missing, crashes or prints nothing, and
# only then every tag is pushed with plain `docker push` — a broken layer never
# reaches the registry; the job summary carries the image size for the release
# notes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/joint-hubs/fenix

jobs:
  publish:
    name: build, smoke, push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Plain release tags (v1.0.0) also move :latest; pre-releases
          # (v1.0.0-rc.1) and manual runs never do.
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') && !contains(github.ref, '+') }}
          labels: |
            org.opencontainers.image.title=Fenix
            org.opencontainers.image.description=Fenix — Linear-driven agent squads with a Supervisor, dashboard and telemetry, every dependency inside

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (loaded locally; pushed only after the smoke step)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke — every tool the doctor lists answers with a version
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image=$(printf '%s\n' "$TAGS" | head -n1)
          echo "smoke image: $image"
          docker run --rm --entrypoint sh "$image" -c '
            set -e
            for t in node git gh claude codegraph semgrep uv python3 tmux; do
              command -v "$t" >/dev/null 2>&1 || { echo "missing: $t" >&2; exit 1; }
            done
            v() { out=$("$@" 2>&1) || { echo "failed: $*" >&2; exit 1; }; [ -n "$out" ] || { echo "empty version: $*" >&2; exit 1; }; printf "%-10s %s\n" "$1" "$(printf "%s" "$out" | head -n1)"; }
            v node --version
            v git --version
            v gh --version
            v claude --version
            v codegraph --version
            v semgrep --version
            v uv --version
            v python3 --version
            v tmux -V
            echo "user       $(id)"
          ' | tee smoke.txt
          # Fenix never runs as root (Dockerfile FENIX_UID guard) — the image
          # must not either. The pipeline above fails the step on any tool
          # failure: GitHub runs this script with bash -eo pipefail.
          ! grep -q 'uid=0(' smoke.txt

      - name: Push every tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done

      - name: Report
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image=$(printf '%s\n' "$TAGS" | head -n1)
          size=$(docker image inspect "$image" --format '{{.Size}}')
          {
            echo "## Fenix image published"
            echo
            echo "Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo "Size (uncompressed): $((size / 1024 / 1024)) MB"
            echo
            echo "Tools:"
            echo '```'
            cat smoke.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
