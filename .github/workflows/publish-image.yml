name: publish-image

# FOC-775: the Fenix image on GHCR. Publishes ghcr.io/joint-hubs/fenix with
# the repository's own GITHUB_TOKEN (packages: write) — no personal token.
#
#   push of a tag v*        → :<version> (v1.0.0 → 1.0.0), :sha-<short>, and
#                             :latest when the tag is a plain release
#                             (no -rc / -beta suffix)
#   workflow_dispatch       → :sha-<short> plus :<branch> (":main" from main) —
#                             the smoke run that proves publishing works
#
# The image is built for uid/gid 1000 (the Dockerfile's FENIX_UID/FENIX_GID
# defaults); a host with another uid builds its thin layer on top at
# `fenix up` / `fenix update` time (FOC-777). The smoke step runs the tools the
# doctor lists so a broken layer never gets a tag; the job summary carries the
# image size for the release notes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/joint-hubs/fenix

jobs:
  publish:
    name: build, smoke, push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Plain release tags (v1.0.0) also move :latest; pre-releases
          # (v1.0.0-rc.1) and manual runs never do.
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=Fenix
            org.opencontainers.image.description=Fenix — Linear-driven agent squads with a Supervisor, dashboard and telemetry, every dependency inside

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (load locally for the smoke step)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke — every tool the doctor lists answers with a version
        run: |
          docker run --rm --entrypoint sh "$IMAGE:smoke" -c '
            set -e
            echo "node     $(node --version)"
            echo "git      $(git --version)"
            echo "gh       $(gh --version | head -1)"
            echo "claude   $(claude --version)"
            echo "codegraph $(codegraph --version)"
            echo "semgrep  $(semgrep --version)"
            echo "uv       $(uv --version)"
            echo "python   $(python3 --version)"
            echo "tmux     $(tmux -V)"
            echo "user     $(id)"
          ' | tee smoke.txt
          # Fenix never runs as root (Dockerfile FENIX_UID guard) — the image
          # must not either.
          ! grep -q 'uid=0(' smoke.txt

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: false

      - name: Report
        run: |
          size=$(docker image inspect "$IMAGE:smoke" --format '{{.Size}}')
          {
            echo "## Fenix image published"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Size (uncompressed): $((size / 1024 / 1024)) MB"
            echo
            echo "Tools:"
            echo '```'
            cat smoke.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
