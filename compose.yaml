# Fenix dev stack — start with ./fenix up.
# Provider keys live in ./.fenix/secrets/ (gitignored, owner-only) and are
# mounted as Compose secrets; they are never baked into the image or printed.
# The API is published on 127.0.0.1 only — it serves local-only endpoints.
# FOC-776 hardens this file (per-squad transcript volumes, resume).
name: fenix

x-fenix: &fenix
  image: fenix:dev
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - path: ./.fenix/fenix.env
      required: false
  secrets:
    - openrouter_api_key
    - linear_api_key
    - github_token
  environment:
    # YAML merge keys (<<) are SHALLOW: a service that declares its own
    # `environment:` replaces this one wholesale — so every service must
    # restate LA_PROJECTS_FILE (and anything else added here later).
    LA_PROJECTS_FILE: /fenix-config/projects.json
  volumes:
    - fenix-data:/data
    - ./.fenix/config:/fenix-config
  restart: unless-stopped

services:
  fenix-api:
    <<: *fenix
    command: ["api"]
    environment:
      LA_PROJECTS_FILE: /fenix-config/projects.json
      # Cockpit (FOC-783): where the fenix-api reaches the Supervisor session
      # host over the compose network (HTTP + WebSocket, never published).
      FENIX_SUPERVISOR_HOST: http://fenix-supervisor:7332
    ports:
      - "127.0.0.1:${FENIX_PORT:-4600}:7331"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7331/api/telemetry/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  fenix-supervisor:
    <<: *fenix
    command: ["host"]
    environment:
      LA_PROJECTS_FILE: /fenix-config/projects.json
      # The host HTTP server accepts requests only from this peer container
      # (children run in the supervisor container as the same user).
      FENIX_HOST_PEER: fenix-api
    stdin_open: true
    tty: true
    healthcheck:
      # Liveness: the data volume is writable, the API answers over the compose
      # network (the Supervisor's telemetry and dashboard depend on it), and the
      # session host on :7332 answers its loopback /healthz — a wedged host
      # restarts the container.
      test: ["CMD", "sh", "-c", "test -w /data/state/supervisor && node -e \"fetch('http://fenix-api:7331/api/telemetry/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" && node -e \"fetch('http://127.0.0.1:7332/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      fenix-api:
        condition: service_healthy

secrets:
  openrouter_api_key:
    file: ./.fenix/secrets/openrouter_api_key
  linear_api_key:
    file: ./.fenix/secrets/linear_api_key
  github_token:
    file: ./.fenix/secrets/github_token

volumes:
  fenix-data: {}
